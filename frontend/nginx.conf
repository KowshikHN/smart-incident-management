server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Keep >= spring.servlet.multipart.max-request-size set in docker-compose.yml
    client_max_body_size 12m;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Docker's embedded DNS. Lets nginx start even if the backend is not up yet
    # and re-resolve "backend" if that container is recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # The backend exposes ALL actuator endpoints with no authentication (env,
    # heapdump, ...). Never serve them publicly. Prometheus scrapes them over the
    # internal Docker network, which does not go through this server.
    location ^~ /actuator {
        return 404;
    }

    # ---------------------------------------------------------------------
    # OPTIONAL: lock down public sign-up.
    # In this app, /api/auth/register creates SUPER_ADMIN accounts, and it is
    # open to anyone. After you have created your own account, uncomment this
    # block and rebuild the frontend image:
    #   docker compose up -d --build frontend
    #
    # location ^~ /api/auth/register {
    #     return 403;
    # }
    # ---------------------------------------------------------------------

    location /api/ {
        set $backend_upstream http://backend:8080;
        proxy_pass $backend_upstream;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed build assets can be cached for a long time.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, otherwise users keep an old bundle.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # React Router: unknown paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
